language: "ko-KR"
early_access: true
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"

  sequence_diagrams: true
  changed_files_summary: true
  collapse_walkthrough: false

  poem: false
  in_progress_fortune: false

  suggested_labels: true
  auto_apply_labels: true

  path_filters:
    - "!**/build/**"
    - "!**/gradle/**"
    - "!**/.claude/**"
    - "!**/HELP.md"
    - "!**/README.md"
    - "!src/test/**"

  path_instructions:

    # ============================================================
    #  1. Domain Layer — 순수 비즈니스 로직
    #  규칙 참조: .claude/rules/domain.md, .claude/rules/code-style.md
    # ============================================================
    - path: "**/domain/**/*.java"
      instructions: >
        **[Hexagonal Architecture - Domain Layer]**

        Domain 계층은 외부 의존성이 없는 순수한 비즈니스 로직이어야 합니다.

        **필수 확인 사항:**

        1. **의존성 방향**: Domain에서 Application·Adapter 계층을 import하면 심각한 아키텍처 위반입니다.
           "[Hexagonal - Domain Violation] Domain 계층은 외부 계층에 의존해서는 안 됩니다." 경고를 남겨주세요.

        2. **외부 라이브러리**: `@Service`, `@Component`, `@Autowired`, Spring 어노테이션 사용 시 경고
           (JPA `@Entity`, `@Column` 등 순수 매핑 어노테이션은 허용).

        3. **기본 클래스 상속**:
           - ID + Audit 필드 필요 → `extends AbstractEntity` 필수
           - Audit 필드만 필요 → `extends BaseEntity` 사용
           어느 쪽도 상속하지 않으면 누락이므로 지적해주세요.

        4. **Setter 금지**: 상태 변경은 반드시 `updateXxx()`, `changeXxx()` 같은 의미 있는 비즈니스 메서드로만 수행.

        5. **생성자 접근 제한**: 기본 생성자는 `@NoArgsConstructor(access = AccessLevel.PROTECTED)`,
           외부 인스턴스 생성은 정적 팩토리 메서드(`create(...)`)를 통해서만 허용.

        6. **소프트 삭제**: `isDeleted = true` 방식만 사용. `repository.delete()` 호출 발견 시 "[DB Convention]" 경고.

        7. **ID 타입**: PK(`@Id`) 및 FK성 필드는 반드시 `Long` 타입. `int`·`Integer` 사용 시 "[DB Convention] Long 타입으로 변경하세요." 경고.

        8. **물리 FK 금지**: `@ForeignKey`, `@JoinColumn(foreignKey = ...)` 등 물리 FK 제약은 사용하지 않습니다. 제안하지 마세요.

        **경고 형식**: "[Hexagonal - Domain Violation]" 또는 "[DB Convention]"

    # ============================================================
    #  2. Application Layer — 유스케이스 / 서비스
    #  규칙 참조: .claude/rules/code-style.md
    # ============================================================
    - path: "**/application/**/*.java"
      instructions: >
        **[Hexagonal Architecture - Application Layer]**

        Application 계층은 비즈니스 유스케이스를 조율합니다.

        **필수 확인 사항:**

        1. **의존성 방향**: Application은 Domain에만 의존 가능. Adapter 구현체를 직접 import하면 위반.
           Port(인터페이스)를 통해 Adapter와 통신해야 합니다.

        2. **Port 활용 구조**:
           - `provided/` — Application이 외부(Controller 등)에 제공하는 포트 인터페이스
           - `required/` — Application이 외부(Repository 등)에 요구하는 포트 인터페이스
           구현체(`*Impl`, `*Adapter`)를 직접 의존하면 안 됩니다.

        3. **서비스 네이밍**: 쓰기 서비스는 `*WriterService`, 읽기 서비스는 `*ReaderService` 또는 `*FinderService`.

        4. **트랜잭션**: `@Transactional` 범위 적절성 확인, 읽기 전용 메서드에 `@Transactional(readOnly = true)` 사용 여부 확인.

        5. **DTO 반환**: Domain Entity를 Controller까지 직접 반환하지 않고 `dto/` 패키지의 DTO로 변환 후 반환.

        6. **비즈니스 로직 위치**: 복잡한 비즈니스 규칙이 Application에 있다면 Domain Entity 메서드로 이동 제안.

        **경고 형식**: "[Hexagonal - Application Violation]"

    # ============================================================
    #  3. Supplier Adapter Layer — 공급사 연동 어댑터
    #  규칙 참조: .claude/rules/webclient.md, .claude/rules/code-style.md
    # ============================================================
    - path: "**/adapter/supplier/**/*.java"
      instructions: >
        **[Supplier Adapter]**

        공급사 연동 어댑터는 WebClient를 사용하고 공급사별 차이를 도메인 계층으로 노출하지 않아야 합니다.

        **필수 확인 사항:**

        1. **HTTP 클라이언트**: 반드시 Spring WebClient 사용. RestTemplate·RestClient 기반 구현은 금지입니다.

        2. **실패 판정 통일**:
           - Supplier A: HTTP `4xx`/`5xx` → 실패
           - Supplier B: HTTP는 항상 200이므로 `resultCode != "0000"` 또는 `data == null` 이면 실패로 처리해야 합니다.
             이를 확인하지 않으면 "[Supplier Adapter] Supplier B 실패 판정 누락" 경고.

        3. **공급사 DTO 격리**: 공급사 전용 요청/응답 DTO가 어댑터 패키지 밖으로 노출되면 "[Supplier Adapter] 공급사 DTO가 도메인 계층으로 노출됩니다." 경고.

        4. **타임아웃 설정**: 연결 타임아웃(connectTimeout)과 응답 타임아웃(responseTimeout)이 각각 설정되어 있는지 확인.

        5. **부분 실패 처리**: 특정 공급사 호출 실패 시 예외를 상위로 전파하지 않고, 성공한 공급사 결과만 반환하는 구조인지 확인.

        6. **배치 제한**: 재고·요금 API 호출 시 한 번에 최대 50개 숙소 코드를 넘기는지 확인. 초과 시 청크 분할 로직 필요.

        **경고 형식**: "[Supplier Adapter]"

    # ============================================================
    #  4. 일반 Adapter Layer
    #  규칙 참조: .claude/rules/code-style.md
    # ============================================================
    - path: "**/adapter/**/*.java"
      instructions: >
        **[Hexagonal Architecture - Adapter Layer]**

        Adapter 계층은 외부 세계(HTTP, DB, Redis 등)와의 연결을 담당합니다.

        **필수 확인 사항:**

        1. **의존성 방향**: Adapter는 Domain·Application에 의존 가능. 다른 Adapter를 직접 의존하면 위반.

        2. **Controller**:
           - `*Api.java`: Swagger 어노테이션 전용 인터페이스. 비즈니스 로직 포함 금지.
           - `*Controller.java`: `*Api` 인터페이스를 구현하며 Application Service를 호출하는 얇은 계층.

        3. **소프트 삭제 쿼리**: `required/` 패키지 Repository 조회 쿼리에 `isDeleted = false` 조건 포함 여부 확인.

        4. **물리 삭제 금지**: `deleteById()`, `delete()` 호출 발견 시 "[DB Convention] 소프트 삭제를 사용하세요." 경고.

        **경고 형식**: "[Hexagonal - Adapter Violation]"

    # ============================================================
    #  5. REST API 설계 원칙
    #  규칙 참조: .claude/rules/api-design.md, .claude/rules/code-style.md
    # ============================================================
    - path: "**/*Controller.java"
      instructions: &rest_api_instructions >
        **[REST API Design]**

        **URI 규칙:**
        - kebab-case URI 사용 (예: `/api/v1/stays/search`)
        - 리소스는 복수형 명사
        - URI에 동사 포함 금지
        - 모든 경로는 `/api/v1/` 접두사 필수

        **응답 형식:**
        - 모든 API는 `ApiResponse<T>` 래퍼를 반환합니다.
        - 성공(데이터 없음): `ApiResponse.success()`
        - 성공(데이터 있음): `ApiResponse.success(data)`
        - `ResponseEntity` 없이 `ApiResponse<T>`를 직접 반환합니다.

        **통합 검색 API 필수 응답 필드 확인:**
        검색 API 응답에 아래 필드가 모두 포함되어 있는지 확인해주세요.
        - 내부 숙소 식별자 · 숙소명 (공급사 코드가 아닌 자사 식별자)
        - 내부 객실 타입 식별자 · 객실 타입명
        - 최대 수용 인원
        - 예약 가능 객실 수 (0이면 예약 불가)
        - 출처 공급사
        - 요금
        - 부분 실패 사실 (일부 공급사 실패 시 응답에 드러나야 함)

        **경고 형식**: "[REST API Convention]"

    - path: "**/*Api.java"
      instructions: *rest_api_instructions

    # ============================================================
    #  6. Port 인터페이스
    # ============================================================
    - path: "**/required/**/*.java"
      instructions: >
        **[Required Port - Repository]**

        1. **소프트 삭제 쿼리**: 조회 쿼리에 반드시 `AND m.isDeleted = false` 조건 포함.

        2. **N+1 예방**: 연관 관계 조회 시 Fetch Join 또는 `@EntityGraph` 사용 여부 확인.

        3. **물리 삭제 금지**: `deleteById()`, `delete()` 선언 발견 시 "[DB Convention] 소프트 삭제를 사용하세요." 경고.

    # ============================================================
    #  7. 식별자 매핑 — DB 설계
    #  규칙 참조: .claude/rules/database.md
    # ============================================================
    - path: "**/mapping/**/*.java"
      instructions: >
        **[Identifier Mapping]**

        공급사 코드 ↔ 내부 식별자 매핑 관련 코드입니다.

        1. **매핑 키 유일성**: 숙소 매핑 키는 `(공급사, hotelCode/propertyId)`, 객실 타입 매핑 키는 `(공급사, 숙소코드, roomTypeCode/roomId)` 세 값이 모두 필요합니다.
           객실 타입 코드만으로 매핑 키를 구성하면 "[DB Convention] 객실 타입 매핑 키에 숙소 코드가 포함되어야 합니다." 경고.

        2. **동일성 보장**: 같은 공급사의 같은 코드는 항상 동일한 내부 식별자를 반환해야 합니다. upsert 또는 findOrCreate 패턴 사용 권장.

        3. **저장 범위**: 요금·재고는 DB에 저장하지 않습니다. 매핑 정보만 저장 대상입니다.

    # ============================================================
    #  8. 예외 처리
    #  규칙 참조: .claude/rules/code-style.md
    # ============================================================
    - path: "**/exception/**/*.java"
      instructions: >
        **[Exception Handling]**

        예외 계층: `RuntimeException` → `GlobalException(ErrorType)` → `{Domain}Exception`

        1. **ErrorType 구현**: `*ErrorType` enum은 반드시 `ErrorType` 인터페이스 구현, `HttpStatus` + 한국어 메시지 포함.
        2. **Exception 클래스**: `{Domain}Exception`은 `GlobalException`을 상속.
        3. **에러 메시지**: 한국어로 작성 (사용자에게 노출됨).
        4. **스택 트레이스 노출 금지**: 응답 바디에 스택 트레이스 미포함 확인.

    # ============================================================
    #  9. 코드 스타일 공통
    #  규칙 참조: .claude/rules/code-style.md
    # ============================================================
    - path: "**/*.java"
      instructions: >
        **[Code Style]**

        1. **클래스·메서드 첫 줄 빈 줄 금지**:
           클래스·메서드 선언 직후 빈 줄이 있으면 "[Code Style] 클래스/메서드의 첫 줄은 띄지 않고 바로 시작해야 합니다." 경고.

        2. **날짜/시간 처리**: `LocalDateTime` 사용 시 UTC 처리 여부 점검.
           불명확하면 `Instant` 또는 `OffsetDateTime` 사용 권장.

        3. **Lombok 사용 원칙**:
           - `@Autowired` 필드 주입 금지 → `@RequiredArgsConstructor` + `final` 필드 DI 사용
           - 도메인 엔티티 setter 생성 금지 (`@Setter` 어노테이션 금지)

        4. **와일드카드 import 금지**: `import java.util.*` 형태 사용 시 경고.

chat:
  auto_reply: true

code_generation:
  docstrings:
    path_instructions:
      - path: "**/*Api.java"
        instructions: "Swagger 어노테이션(@Operation, @ApiResponse, @Schema)에 들어갈 설명을 포함하여 JavaDoc을 작성해주세요."
      - path: "**/application/**/*WriterService.java"
        instructions: "비즈니스 로직의 예외 케이스와 @Transactional 범위를 명시하는 JavaDoc을 작성해주세요."
      - path: "**/application/**/*ReaderService.java"
        instructions: "조회 조건(isDeleted = false 포함 여부)을 명시하는 JavaDoc을 작성해주세요."

  unit_tests:
    path_instructions:
      - path: "**/application/**/*.java"
        instructions: >
          JUnit 5 + Mockito를 사용하고, 테스트 클래스에는 `@ExtendWith(MockitoExtension.class)`를 붙여주세요.
          메서드 이름은 한국어로 작성하고 Given/When/Then 구조를 따릅니다.
          예: `void 공급사_응답_정상_시_통합_모델로_변환()`.
          커버리지 제외 대상(dto, exception, config, webapi)은 테스트 불필요합니다.

pre_merge_checks:
  title:
    mode: "warning"
  description:
    mode: "warning"
  docstrings:
    mode: "warning"
    threshold: 50
  issue_assessment:
    mode: "warning"

tools:
  gitleaks:
    enabled: true
  osv-scanner:
    enabled: true
  pmd:
    enabled: true
  markdownlint:
    enabled: true
  actionlint:
    enabled: true
  yamllint:
    enabled: true
  github-checks:
    enabled: true
