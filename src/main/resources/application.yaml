spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stayplatformdb
    username: stayplatform
    password: stayplatform

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

supplier:
  a:
    base-url: http://localhost:9090
    api-key: test-key-a
    timeout:
      connect-ms: 3000
      response-ms: 5000
  b:
    base-url: http://localhost:9090
    api-key: test-key-b
    timeout:
      connect-ms: 3000
      response-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      supplierA:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        register-health-indicator: true
      supplierB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        register-health-indicator: true
  retry:
    instances:
      supplierA:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.stayplatform.stay.exception.SupplierUnavailableException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      supplierB:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.stayplatform.stay.exception.SupplierUnavailableException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
